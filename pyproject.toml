[tool.poetry]
name = "qwen-dictation"
version = "0.1.0"
description = "Local macOS dictation app based on Qwen3-ASR"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
# requirements.txt is the source of truth for the supported environment.
# transformers must stay pinned: newer releases break qwen-asr.
python = ">=3.10,<3.14"
pyaudio = "^0.2.13"
rumps = "^0.4.0"
pynput = "^1.7.6"
flask = "^3.0.0"
hf-transfer = "*"
huggingface-hub = "==0.36.2"
modelscope = "*"
numpy = "*"
qwen-asr = "==0.0.6"
soundfile = "*"
torch = "*"
torchaudio = "*"
transformers = "==4.57.6"
accelerate = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
